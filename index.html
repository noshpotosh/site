<style>
:root{--ink:#09131f;--muted:#263344;--paper:#f8f7f4;--mono:Menlo,Monaco,'Cascadia Mono',monospace}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:var(--paper);font-family:Arial,Helvetica,sans-serif}.page{min-height:100svh;display:flex;flex-direction:column}.menubar{min-height:58px;display:flex;justify-content:flex-start;align-items:center;background:linear-gradient(#dededc,#cececc);border-bottom:2px groove #a4acb5}.site-name{font:600 16px var(--mono);margin-left:26px;color:var(--muted)}main{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:52px 24px 58px;background:radial-gradient(ellipse at center,#fffdfb,var(--paper) 75%)}.content{width:100%;max-width:1100px}.cone{width:126px;height:126px;display:block;margin:0 auto 27px;image-rendering:pixelated}h1{font-size:clamp(38px,5vw,68px);font-weight:750;letter-spacing:-2px;line-height:1.12;margin:0 0 22px}.intro{font:clamp(16px,1.8vw,24px)/1.5 var(--mono);color:var(--muted);margin:0 0 35px}.intro span{display:block}.progress-frame{width:min(486px,100%);margin:auto;border:1px solid #798490;background:#d1d2d0;padding:5px;box-shadow:inset 1px 1px #fff,inset -1px -1px #fff}.progress-track{height:32px;border:2px inset #eee;padding:3px;display:flex;gap:4px;background:linear-gradient(#d1d2d2,#ddd)}.segment{width:calc((100% - 44px)/13);background:linear-gradient(135deg,#4b8dc8,#2b68a3);border:1px solid #5183b1}.progress-caption{margin:12px 0 47px;font:17px/1.5 var(--mono);color:var(--muted)}.bevel{display:inline-flex;justify-content:center;align-items:center;background:linear-gradient(#dededc,#ccc);border:1px solid #77808a;box-shadow:inset 1px 1px white,inset -2px -2px #79818a;padding:15px 30px;min-width:270px;min-height:58px;font:21px Arial,sans-serif;color:var(--ink);text-decoration:none;cursor:pointer}.bevel:active{box-shadow:inset 2px 2px #737981,inset -1px -1px white}.github{display:block;margin:25px auto 0;padding:0;border:0;background:none;font:21px var(--mono);color:#28629e;text-decoration:underline;text-underline-offset:5px;cursor:pointer;width:fit-content}.statusbar{display:flex;justify-content:space-between;align-items:center;gap:15px;background:linear-gradient(#dadad8,#cececc);border-top:2px groove #a7afb6;min-height:50px;padding:8px 28px;font:15px/1.4 var(--mono);color:var(--muted)}.status-right{border-left:2px groove #eee;padding-left:39px;display:flex;align-items:center;gap:20px}.light{width:20px;height:20px;flex-shrink:0;border:2px solid #a8751b;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff8ca 0 15%,#ffd66a 22%,#ffb219 58%,#c88100);box-shadow:1px 1px 1px #777}button:focus-visible,a:focus-visible{outline:2px dotted #263344;outline-offset:5px}@media(max-width:600px){.menubar{min-height:52px}.site-name{font-size:14px;margin-left:14px}main{padding:42px 22px}.cone{width:100px;height:100px;margin-bottom:25px}h1{letter-spacing:-1.4px;font-size:42px}.intro{font-size:15px;margin-bottom:29px}.intro span+span{margin-top:8px}.progress-caption{font-size:13px;margin-bottom:32px}.bevel{min-width:240px;min-height:52px;font-size:18px}.github{font-size:18px;margin-top:23px}.statusbar{padding:10px 14px;font-size:11px}.status-right{padding-left:16px;gap:10px}.light{width:16px;height:16px}}@media(max-height:740px) and (min-width:601px){main{padding:32px 24px}.cone{width:96px;height:96px;margin-bottom:20px}h1{font-size:54px}.intro{font-size:20px;margin-bottom:25px}.progress-caption{margin-bottom:28px}.github{margin-top:20px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
/* Keep the classic window frame flush with the viewport edges. */
body{min-height:100svh;padding:5px;border:1px solid #69727b;background:#cececc;box-shadow:inset 1px 1px #fff,inset -1px -1px #fff}
.page{min-height:calc(100svh - 12px);border:1px solid #78838d;box-shadow:0 0 0 1px #eee}
/* Keep the stepped desktop feel, with a little life at the leading edge. */
.progress-track{position:relative;overflow:hidden}
.progress-track::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 25%,#fff8 50%,transparent 75%);transform:translateX(-110%)}
.progress-track.is-complete::after{animation:completion-sweep 700ms ease-in-out both}
.segment{flex:1;min-width:0;opacity:0;transform:scaleY(.82);transition:opacity 160ms linear,transform 200ms ease-out}
.segment.is-filled{opacity:1;transform:scaleY(1)}
.segment.is-leading{animation:leading-glow 900ms ease-in-out infinite alternate}
.progress-track.is-paused::after,.progress-track.is-paused .segment{animation-play-state:paused}
@keyframes leading-glow{from{filter:brightness(1);box-shadow:inset 0 1px #ffffff25}to{filter:brightness(1.22);box-shadow:inset 0 1px #ffffff80,0 0 5px #4b8dc855}}
@keyframes completion-sweep{to{transform:translateX(110%)}}
.progress-caption{min-height:1.5em}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(prefers-reduced-motion:reduce){.segment{transition:none;transform:none}.segment.is-leading,.progress-track.is-complete::after{animation:none}}
</style>
</head>
<body>

<h1 id="page-heading">Under construction</h1>
<p class="intro"><span>I’m putting the finishing touches on my portfolio.</span><span>Good things take a little time. Check back soon.</span></p>
<div class="progress-frame" aria-hidden="true"><div class="progress-track"><span class="segment is-filled"></span><span class="segment is-filled"></span><span class="segment is-filled"></span><span class="segment is-filled"></span><span class="segment is-filled"></span><span class="segment is-filled"></span><span class="segment"></span><span class="segment"></span><span class="segment"></span><span class="segment"></span><span class="segment"></span><span class="segment"></span><span class="segment"></span></div></div>
<p class="progress-caption"><span class="sr-only">Portfolio build in progress.</span><span aria-hidden="true"><span id="loading-phrase">Building something useful</span></span></p>
<a class="bevel" href="mailto:stewartnoahj@gmail.com">Get in touch</a>

</section></main>

</div>
<script>
(() => {
  const phrases = [
    'Building something useful',
    'Putting the pieces together',
    'Fine-tuning the details',
    'Making room for good ideas'
  ];
  const segments = [...document.querySelectorAll('.segment')];
  const track = document.querySelector('.progress-track');
  const phrase = document.querySelector('#loading-phrase');
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  // A few quick steps and thoughtful pauses make each pass feel less mechanical.
  const stepDelays = [280, 190, 420, 240, 650, 260, 180, 540, 230, 360, 720, 260, 1250];
  let filled = 6;
  let pass = 0;
  let timer;

  function render() {
    segments.forEach((segment, index) => {
      segment.classList.toggle('is-filled', index < filled);
      segment.classList.toggle('is-leading', index === filled - 1 && filled < segments.length && !reducedMotion.matches);
    });
    track.classList.toggle('is-complete', filled === segments.length && !reducedMotion.matches);
    phrase.textContent = phrases[pass % phrases.length];
  }

  function advance() {
    if (filled === segments.length) {
      filled = 1;
      pass += 1;
    } else {
      filled += 1;
    }
    render();
    schedule();
  }

  function schedule() {
    timer = setTimeout(advance, stepDelays[filled - 1]);
  }

  function updateAnimation() {
    clearTimeout(timer);
    track.classList.toggle('is-paused', document.hidden);
    if (reducedMotion.matches) {
      filled = 6;
      pass = 0;
      render();
      return;
    }
    render();
    if (!document.hidden) {
      schedule();
    }
  }

  reducedMotion.addEventListener('change', updateAnimation);
  document.addEventListener('visibilitychange', updateAnimation);
  updateAnimation();
})();
</script>
</body>
